[package]
name = "remoted"
version = "0.20.0"
edition = "2021"
authors = ["Bolt J Woofson <bolt@boop.no>"]
description = "Web gateway for remote access: RDP, VNC, SSH, Telnet and local shells in the browser, in one Rust binary"
license = "MIT"
repository = "https://github.com/Woofson/remote"
homepage = "https://github.com/Woofson/remote"
readme = "README.md"
keywords = ["remote", "rdp", "vnc", "ssh", "gateway"]
categories = ["network-programming", "command-line-utilities", "web-programming"]
# Pictures for the README and source artwork are not needed to build Remote
exclude = ["/*.png", "assets/*.png", "assets/screenshots/"]

[lib]
name = "remoted"
path = "src/lib.rs"

[[bin]]
name = "remoted"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "fs"] }
# Already part of axum; used directly to strip the sub-path before routing (#3)
tower = { version = "0.5", default-features = false, features = ["util"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
argon2 = "0.5"
jsonwebtoken = "9.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
ssh2 = "0.9"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
flate2 = "1.1"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
# Two-factor authentication (TOTP): HMAC-SHA1 codes, base32 secrets, QR code for setup
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2.6"
qrcodegen = "1.8"
# Email (#27): SMTP over rustls (no OpenSSL), trusting the system's certificate store
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls", "ring", "rustls-native-certs"] }
tempfile = "3.16"
libc = "0.2"
dirs = "5.0"
open = "5.3"
async-trait = "0.1"
urlencoding = "2.1"
# RDP client engine adapted from ironrdp-client 0.1.0 lives in src/protocols/rdp_client
# (see docs/rdp-client.md); these are its direct dependencies.
anyhow = "1"
url = "2"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
ironrdp-cfg = "0.1"
ironrdp-propertyset = "0.1"
ironrdp-displaycontrol = "0.8"
ironrdp-dvc = "0.8"
ironrdp-echo = "0.4"
ironrdp-rdcleanpath = "0.2"
ironrdp-cliprdr-native = "0.7"
ironrdp-connector = "0.10.0"
ironrdp-session = "0.11.0"
ironrdp-pdu = "0.9.0"
ironrdp-graphics = "0.9.0"
ironrdp-async = "0.10.0"
ironrdp-tls = { version = "0.2.2", features = ["rustls"] }
ironrdp-tokio = { version = "0.10.0", features = ["reqwest"] }
ironrdp-rdpdr = "0.7.0"
ironrdp-rdpdr-native = "0.7.0"
ironrdp-cliprdr = "0.7.0"
ironrdp-rdpsnd = "0.9.0"
ironrdp-svc = "0.8.0"
ironrdp-core = "0.2.0"
smallvec = "1.16.0"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "ring", "std"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
# Build timestamp for the version info (already a dependency of Remote itself)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
