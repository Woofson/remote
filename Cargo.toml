[package]
name = "remoted"
version = "0.2.0"
edition = "2021"
authors = ["Bolt J Woofson <bolt@boop.no>"]
description = "High-Performance Rust Remote Gateway (RDP, VNC, SSH) with Multi-Pane HTML5 Canvas & Woofson UI"
license = "MIT"

[lib]
name = "remoted"
path = "src/lib.rs"

[[bin]]
name = "remoted"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
argon2 = "0.5"
jsonwebtoken = "9.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
ssh2 = "0.9"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
tempfile = "3.16"
libc = "0.2"
dirs = "5.0"
open = "5.3"
async-trait = "0.1"
urlencoding = "2.1"
ironrdp-client = { version = "0.1.0", features = ["rustls"] }
ironrdp-connector = "0.10.0"
ironrdp-session = "0.11.0"
ironrdp-pdu = "0.9.0"
ironrdp-graphics = "0.9.0"
ironrdp-async = "0.10.0"
ironrdp-tls = { version = "0.2.2", features = ["rustls"] }
ironrdp-tokio = { version = "0.10.0", features = ["reqwest"] }
ironrdp-rdpdr = "0.7.0"
ironrdp-rdpdr-native = "0.7.0"
smallvec = "1.16.0"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "ring", "std"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
