# Remote Configuration File
# Unified High-Performance Rust Remote Gateway (RDP, VNC, SSH) with Woofson UI

[server]
bind_address = "0.0.0.0:8088"
data_dir = "./data"
jwt_secret = "remote-super-secret-jwt-key-woofson-2026"
token_expiry_hours = 24

[storage]
# Staging directory for file transfers and dropboxes
staging_dir = "./data/staging"
max_upload_size_mb = 2048
auto_cleanup_hours = 24

[auth]
# Allow local database logins
allow_local_login = true
# Allow Linux PAM logins (if compiled with pam support)
allow_pam_login = false
# Default role for newly registered or auto-provisioned users ("admin", "operator", "viewer")
default_role = "operator"

[oidc]
# OpenID Connect / OAuth2 integration (Authentik, Keycloak, Authelia, Google, etc.)
enabled = false
provider_name = "Authentik"
issuer_url = "https://authentik.example.com/application/o/remote/"
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:8088/api/auth/oidc/callback"
scopes = ["openid", "profile", "email", "groups"]
auto_provision_users = true
admin_group = "Remote-Admins"
operator_group = "Remote-Operators"

[clipboard]
# Default clipboard synchronization mode ("bidirectional", "server_to_client", "client_to_server", "disabled")
default_mode = "bidirectional"
# Maximum clipboard text size in bytes (1MB default)
max_text_size_bytes = 1048576

[logging]
level = "info"
